{% extends "djangordf/admin/base.html" %}
{% block title %}Delete {{ model_name }}{% endblock %}
{% block content %}
<h1>Delete {{ model_name }}</h1>
<p>You are about to delete <span class="iri">{{ instance.iri }}</span>. This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'djangordf_admin:changelist' model_name=model_name %}">Cancel</a>
</form>
{% endblock %}
